# Cấu hình jail fail2ban cho DSS-VN — xem 2 bộ lọc đi kèm trong ../filter.d/ và hướng dẫn cài đặt đầy
# đủ tại HUONG_DAN_DEPLOY_UBUNTU.md mục 9d.
#
# Ngưỡng bên dưới đủ cao để không chặn nhầm người dùng thật gõ sai vài lần, chỉ bắt IP có HÀNH VI
# BẤT THƯỜNG rải trên nhiều tài khoản/nhiều request.

[dssvn-login]
enabled  = true
port     = http,https
filter   = dssvn-login
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 600
bantime  = 3600

[dssvn-ratelimit]
enabled  = true
port     = http,https
filter   = dssvn-ratelimit
logpath  = /var/log/nginx/access.log
maxretry = 15
findtime = 600
bantime  = 3600
