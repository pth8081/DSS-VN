# Cấu hình jail fail2ban cho VPDT DMS — xem 2 bộ lọc đi kèm trong ../filter.d/ và hướng dẫn cài đặt đầy
# đủ tại HUONG_DAN_DEPLOY_UBUNTU.md mục 9d.
#
# Ngưỡng bên dưới cố ý CAO HƠN ngưỡng khoá tài khoản của ứng dụng (5 lần sai liên tục —
# server/lib/loginAttempts.js) vì mục tiêu ở đây khác: không phải bảo vệ 1 tài khoản cụ thể (đã có lớp
# đó rồi) mà bắt 1 IP có HÀNH VI BẤT THƯỜNG rải trên nhiều tài khoản/nhiều request — cần đủ dữ liệu để
# không chặn nhầm người dùng thật gõ sai vài lần.

[vpdt-login]
enabled  = true
port     = http,https
filter   = vpdt-login
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 600
bantime  = 3600

[vpdt-ratelimit]
enabled  = true
port     = http,https
filter   = vpdt-ratelimit
logpath  = /var/log/nginx/access.log
maxretry = 15
findtime = 600
bantime  = 3600
