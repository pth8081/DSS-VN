# Bộ lọc fail2ban — khớp các lượt đăng nhập SAI vào /api/auth/login (server trả 401) đọc từ log truy
# cập Nginx (access log định dạng combined mặc định). Bắt IP dò mật khẩu rải trên nhiều tài khoản
# khác nhau (server chỉ giới hạn tần suất theo IP qua express-rate-limit — xem
# server/routes/auth.js — chưa khoá theo từng tài khoản) và chặn hẳn ở FIREWALL.
#
# Cài đặt: xem HUONG_DAN_DEPLOY_UBUNTU.md mục 9d.
[Definition]
failregex = ^<HOST> -.*"POST /api/auth/login HTTP/\d\.\d" 401
ignoreregex =
