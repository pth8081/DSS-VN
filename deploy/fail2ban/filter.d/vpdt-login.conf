# Bộ lọc fail2ban — khớp các lượt đăng nhập SAI vào /api/auth/login (server trả 401) đọc từ log truy
# cập Nginx (access log định dạng combined mặc định). Dùng cùng lib/loginAttempts.js phía ứng dụng (khoá
# tài khoản sau 5 lần sai) làm 2 lớp phòng thủ độc lập: lớp này chặn ở FIREWALL (trước khi request chạm
# tới Nginx/Node lần sau), lớp kia chặn ở tầng ứng dụng theo TÀI KHOẢN cụ thể — 1 IP dò mật khẩu rải
# nhiều tài khoản khác nhau (né được khoá theo tài khoản) vẫn bị bắt ở đây vì đếm theo IP.
#
# Cài đặt: xem HUONG_DAN_DEPLOY_UBUNTU.md mục 9d.
[Definition]
failregex = ^<HOST> -.*"POST /api/auth/login HTTP/\d\.\d" 401
ignoreregex =
