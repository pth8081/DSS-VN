# Bộ lọc fail2ban — khớp MỌI request bị chính ứng dụng trả 429 (Too Many Requests), đọc từ log truy
# cập Nginx. Server đã có nhiều lớp rate-limit riêng (đăng nhập, API chung, tải file — xem
# server/server.js + server/routes/auth.js + server/routes/upload.js), nhưng đó chỉ là "làm chậm/từ
# chối tạm thời" — request vẫn phải đi hết qua Nginx + Node mỗi lần. Bộ lọc này bắt IP bị 429 LẶP LẠI
# NHIỀU LẦN (dấu hiệu rõ ràng của bot/script tự động, người dùng thật hiếm khi chạm ngưỡng rate-limit
# nhiều lần liên tục) rồi chặn hẳn ở firewall, đỡ tải cho tầng ứng dụng.
#
# Cài đặt: xem HUONG_DAN_DEPLOY_UBUNTU.md mục 9d.
[Definition]
failregex = ^<HOST> -.*" 429
ignoreregex =
